name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --clean --windowed --name TDsearch --collect-all PySide6 --collect-all xlsxgrep tdsearch/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: TDsearch-windows
          path: dist/TDsearch/TDsearch.exe

  macos:
    name: macOS DMG and PKG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build application bundle and installers
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --clean --windowed --name TDsearch --collect-all PySide6 --collect-all xlsxgrep tdsearch/app.py
          VERSION=$(python -c "from tdsearch import __version__; print(__version__)")
          hdiutil create -volname TDsearch -srcfolder dist/TDsearch.app -ov -format UDZO "dist/TDsearch-${VERSION}-macos.dmg"
          productbuild --component dist/TDsearch.app /Applications "dist/TDsearch-${VERSION}-macos.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: TDsearch-macos
          path: |
            dist/*.dmg
            dist/*.pkg

  debian:
    name: Debian DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Debian package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --clean --windowed --name tdsearch --collect-all PySide6 --collect-all xlsxgrep tdsearch/app.py
          VERSION=$(python -c "from tdsearch import __version__; print(__version__)")
          mkdir -p package-deb/DEBIAN package-deb/usr/lib/tdsearch package-deb/usr/bin package-deb/usr/share/applications
          cp -R dist/tdsearch package-deb/usr/lib/tdsearch/
          ln -s /usr/lib/tdsearch/tdsearch/tdsearch package-deb/usr/bin/tdsearch
          printf 'Package: tdsearch\nVersion: %s\nArchitecture: amd64\nMaintainer: Ivan Cvitic <cviticivan@gmail.com>\nDepends: libgl1, libegl1\nDescription: Desktop GUI for tabular data search\n' "$VERSION" > package-deb/DEBIAN/control
          printf '[Desktop Entry]\nType=Application\nName=TDsearch\nExec=tdsearch\nCategories=Utility;Office;\nTerminal=false\n' > package-deb/usr/share/applications/tdsearch.desktop
          dpkg-deb --build package-deb "dist/tdsearch-${VERSION}-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: TDsearch-debian
          path: dist/*.deb

  fedora:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf -y install python3 python3-pip rpm-build findutils

      - name: Build RPM package
        run: |
          set -euxo pipefail

          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages . pyinstaller
          python3 -m PyInstaller --noconfirm --clean --windowed --name tdsearch --collect-all PySide6 --collect-all xlsxgrep tdsearch/app.py

          VERSION=$(python3 -c "from tdsearch import __version__; print(__version__)")

          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p package-rpm/usr/lib/tdsearch package-rpm/usr/bin package-rpm/usr/share/applications

          cp -R dist/tdsearch package-rpm/usr/lib/tdsearch/
          ln -s /usr/lib/tdsearch/tdsearch/tdsearch package-rpm/usr/bin/tdsearch

          cat > package-rpm/usr/share/applications/tdsearch.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TDsearch
          Exec=tdsearch
          Categories=Utility;Office;
          Terminal=false
          EOF

          tar -C package-rpm -czf "rpmbuild/SOURCES/tdsearch-${VERSION}.tar.gz" .

          cat > rpmbuild/SPECS/tdsearch.spec <<EOF
          Name: tdsearch
          Version: ${VERSION}
          Release: 1%{?dist}
          Summary: Desktop GUI for tabular data search
          License: MIT
          BuildArch: x86_64
          Source0: %{name}-%{version}.tar.gz

          %global debug_package %{nil}
          %undefine _missing_build_ids_terminate_build

          %description
          Desktop GUI for tabular data search.

          %prep
          %setup -q -c -T
          tar -xzf %{SOURCE0}

          %install
          mkdir -p %{buildroot}
          cp -a . %{buildroot}/

          %files
          /usr

          %changelog
          * Wed Sep 03 2026 Ivan Cvitic <cviticivan@gmail.com> - ${VERSION}-1
          - Initial Fedora package
          EOF

          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "debug_package %{nil}" \
            -bb rpmbuild/SPECS/tdsearch.spec

          cp rpmbuild/RPMS/x86_64/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: TDsearch-fedora
          path: dist/*.rpm