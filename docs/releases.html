<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Download TDsearch releases for Windows, macOS, and Linux.">
  <title>TDsearch | Releases</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    :root { --navy:#10233f; --blue:#1463df; --sky:#eaf2ff; --ink:#172437; --muted:#617089; --line:#dce3ed; --cloud:#f7f9fc; }
    * { box-sizing:border-box; } body { margin:0; background:var(--cloud); color:var(--ink); font-family:"Plus Jakarta Sans",sans-serif; }
    a { color:inherit; text-decoration:none; }.container { width:min(980px,calc(100% - 48px)); margin:0 auto; }
    header { padding:24px 0; background:#fff; border-bottom:1px solid var(--line); }.nav { display:flex; align-items:center; justify-content:space-between; }.brand { display:inline-flex; align-items:center; gap:10px; color:var(--navy); font-size:18px; font-weight:800; }.brand-mark { display:grid; place-items:center; width:31px; height:31px; border-radius:7px; background:var(--blue); color:#fff; font-family:"IBM Plex Mono",monospace; font-size:12px; }.back-link { color:var(--blue); font-size:13px; font-weight:700; }
    main { padding:72px 0 96px; }.eyebrow { color:var(--blue); font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }.intro { max-width:680px; margin-bottom:42px; }.intro h1 { margin:16px 0 14px; color:var(--navy); font-size:clamp(36px,5vw,58px); line-height:1.08; }.intro p { margin:0; color:var(--muted); font-size:16px; line-height:1.7; }
    .status { margin-bottom:18px; color:var(--muted); font-size:13px; }.release-list { display:grid; gap:20px; }.release { padding:28px; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:0 12px 30px rgba(31,53,79,.06); }.release-head { display:flex; align-items:start; justify-content:space-between; gap:20px; margin-bottom:22px; }.release h2 { margin:0 0 7px; color:var(--navy); font-size:25px; }.release-date { color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:12px; }.release-link { color:var(--blue); font-size:12px; font-weight:700; white-space:nowrap; }.platform-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }.platform-group { min-width:0; }.platform-heading { display:flex; align-items:center; gap:9px; margin:0 0 10px; color:var(--navy); font-size:14px; }.platform-icon { display:grid; place-items:center; width:30px; height:30px; border-radius:6px; background:var(--sky); color:var(--blue); font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:500; }.platform-icon.debian { color:#b3264a; background:#fbeaf0; }.platform-icon.fedora { color:#2463a5; background:#eaf3ff; }.platform-icon.arch { color:#3d4652; background:#edf0f4; }.platform-icon.windows { color:#1266bc; background:#e8f3ff; }.platform-icon.macos { color:#111; background:#eef0f2; }.asset-grid { display:grid; gap:8px; }.asset { display:flex; flex-direction:column; justify-content:space-between; min-height:92px; padding:15px; border:1px solid var(--line); border-radius:6px; background:var(--cloud); }.asset-name { overflow-wrap:anywhere; color:var(--navy); font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1.45; }.asset-download { display:inline-flex; align-items:center; justify-content:center; min-height:34px; margin-top:13px; padding:0 10px; border-radius:5px; background:var(--blue); color:#fff; font-size:12px; font-weight:800; }.empty { padding:28px; border:1px dashed var(--line); color:var(--muted); background:#fff; }.error { color:#a33a2f; }
    footer { padding:28px 0; border-top:1px solid var(--line); background:#fff; color:var(--muted); font-size:12px; }.footer-row { display:flex; justify-content:space-between; gap:20px; }.footer-row a { color:var(--blue); }
    @media (max-width:900px) { .platform-grid { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:700px) { .container { width:min(100% - 32px,600px); } main { padding:52px 0 70px; }.release { padding:22px; }.release-head { display:block; }.release-link { display:inline-block; margin-top:12px; }.platform-grid { grid-template-columns:1fr; }.footer-row { display:block; }.footer-row span { display:block; margin-top:8px; } }
  </style>
</head>
<body>
  <header><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">TD</span>TDsearch</a><a class="back-link" href="index.html">Back to TDsearch</a></div></header>
  <main class="container">
    <section class="intro"><span class="eyebrow">Downloads</span><h1>TDsearch releases.</h1><p>Choose the package for your platform. Release files are loaded directly from the TDsearch GitHub repository.</p></section>
    <div id="status" class="status">Loading releases...</div>
    <section id="release-list" class="release-list" aria-live="polite"></section>
  </main>
  <footer><div class="container footer-row"><a href="index.html">TDsearch</a><span>Tabular Data Search powered by <a href="https://zazuum.github.io/xlsxgrep/">xlsxgrep</a>.</span></div></footer>
  <script>
    (function () {
      var apiUrl = "https://api.github.com/repos/zazuum/TDsearch/releases";
      var list = document.getElementById("release-list");
      var status = document.getElementById("status");
      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, function (character) {
          return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[character];
        });
      }
      function assetPlatform(asset) {
        var name = asset.name.toLowerCase();
        if (name.indexOf('.deb') !== -1) return { key: "debian", label: "Debian / Ubuntu", icon: "DEB" };
        if (name.indexOf('.rpm') !== -1) return { key: "fedora", label: "Fedora / Red Hat / SUSE", icon: "RPM" };
        if (name.indexOf('.pkg.tar') !== -1) return { key: "arch", label: "Arch Linux", icon: "ARCH" };
        if (name.indexOf('windows') !== -1 || name.indexOf('.exe') !== -1) return { key: "windows", label: "Windows", icon: "WIN" };
        if (name.indexOf('macos') !== -1 || name.indexOf('.dmg') !== -1 || name.indexOf('.pkg') !== -1) return { key: "macos", label: "macOS", icon: "MAC" };
        return { key: "other", label: "Other files", icon: "FILE" };
      }
      function renderAsset(asset) {
        return '<article class="asset"><span class="asset-name">' + escapeHtml(asset.name) + '</span><a class="asset-download" href="' + escapeHtml(asset.browser_download_url) + '">Download</a></article>';
      }
      function renderRelease(release) {
        var assets = release.assets || [];
        var groups = {};
        assets.forEach(function (asset) {
          var platform = assetPlatform(asset);
          if (!groups[platform.key]) groups[platform.key] = { platform: platform, assets: [] };
          groups[platform.key].assets.push(asset);
        });
        var assetMarkup = Object.keys(groups).map(function (key) {
          var group = groups[key];
          return '<section class="platform-group"><h3 class="platform-heading"><span class="platform-icon ' + group.platform.key + '">' + group.platform.icon + '</span>' + group.platform.label + '</h3><div class="asset-grid">' + group.assets.map(renderAsset).join("") + '</div></section>';
        }).join("");
        if (!assetMarkup) assetMarkup = '<p class="empty">No files are attached to this release.</p>';
        var date = release.published_at ? new Date(release.published_at).toLocaleDateString() : "";
        return '<article class="release"><div class="release-head"><div><h2>' + escapeHtml(release.name || release.tag_name) + '</h2><span class="release-date">' + escapeHtml(date) + '</span></div><a class="release-link" href="' + escapeHtml(release.html_url) + '">View release notes</a></div><div class="platform-grid">' + assetMarkup + '</div></article>';
      }
      fetch(apiUrl, { headers: { "Accept": "application/vnd.github+json" } })
        .then(function (response) { return response.ok ? response.json() : Promise.reject(response.status); })
        .then(function (releases) {
          if (!releases.length) { status.textContent = "No releases published yet."; return; }
          status.textContent = releases.length + " release" + (releases.length === 1 ? "" : "s") + " available";
          list.innerHTML = releases.map(renderRelease).join("");
        })
        .catch(function () {
          status.textContent = "Could not load releases.";
          status.className = "status error";
          list.innerHTML = '<p class="empty">Visit the <a href="https://github.com/zazuum/TDsearch/releases">GitHub releases page</a> to download files.</p>';
        });
    })();
  </script>
</body>
</html>
